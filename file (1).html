<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do & Progress Tracker (Animated + Timer)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animate.css CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
        /* ปรับความเร็วของ Animate.css ให้กระฉับกระเฉงและนุ่มนวล */
        :root {
            --animate-duration: 0.35s;
        }
        /* ปรับแต่งแถบเลื่อนให้ดูสะอาดตา */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        /* คลาสเสริมสำหรับ Micro-interactions */
        .task-card-transition {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .task-card-transition:hover {
            transform: translateY(-3px) scale(1.01);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-sky-500 text-white p-2.5 rounded-xl shadow-sm transform transition hover:rotate-6 hover:scale-110">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-semibold text-slate-800">ระบบติดตามงาน & เวลา</h1>
                    <p class="text-xs text-slate-500">Real-time To-Do & Progress Tracker</p>
                </div>
            </div>
            
            <!-- สรุปภาพรวมความคืบหน้า -->
            <div class="flex items-center gap-3 text-xs sm:text-sm bg-slate-100 px-4 py-2.5 rounded-xl border border-slate-200/60">
                <span class="text-slate-600">งานทั้งหมด: <strong id="total-count" class="text-slate-900 font-semibold">0</strong></span>
                <span class="text-slate-300">|</span>
                <span class="text-emerald-600 flex items-center gap-1">
                    สำเร็จแล้ว: <strong id="done-percent" class="font-semibold">0%</strong>
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- ฟอร์มเพิ่มงานใหม่ -->
        <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 transition-all hover:shadow-md">
            <form id="task-form" class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="task-input" 
                    placeholder="พิมพ์สิ่งที่ต้องทำที่นี่... (ระบบจะเริ่มจับเวลาทันที)" 
                    required
                    autocomplete="off"
                    class="flex-1 px-4 py-3.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 text-base transition-all"
                >
                <button 
                    type="submit" 
                    class="bg-sky-500 hover:bg-sky-600 active:scale-95 hover:scale-[1.02] text-white font-medium px-6 py-3.5 rounded-xl shadow-sm hover:shadow transition-all duration-200 flex items-center justify-center gap-2 text-base shrink-0 cursor-pointer"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                    <span>เพิ่มงานใหม่</span>
                </button>
            </form>
        </section>

        <!-- กระดาน 3 คอลัมน์ (Responsive Grid) -->
        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- คอลัมน์ 1: สิ่งที่ต้องทำ (To Do) -->
            <div class="bg-slate-100/80 rounded-2xl p-4 border border-slate-200 flex flex-col">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-200">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-slate-400"></span>
                        <h2 class="font-semibold text-slate-700 text-base">1. สิ่งที่ต้องทำ (To Do)</h2>
                    </div>
                    <span id="count-todo" class="bg-slate-200 text-slate-700 text-xs font-semibold px-2.5 py-1 rounded-full transition-all">0</span>
                </div>
                <div id="list-todo" class="space-y-3.5 flex-1 min-h-[180px]">
                    <!-- รายการงานจะถูกแสดงที่นี่ -->
                </div>
            </div>

            <!-- คอลัมน์ 2: กำลังทำ (In Progress) -->
            <div class="bg-sky-50/70 rounded-2xl p-4 border border-sky-100 flex flex-col">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-sky-200/70">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-sky-500 animate-ping absolute"></span>
                        <span class="w-3 h-3 rounded-full bg-sky-500 relative"></span>
                        <h2 class="font-semibold text-sky-900 text-base">2. กำลังทำ (In Progress)</h2>
                    </div>
                    <span id="count-inprogress" class="bg-sky-200/80 text-sky-800 text-xs font-semibold px-2.5 py-1 rounded-full transition-all">0</span>
                </div>
                <div id="list-inprogress" class="space-y-3.5 flex-1 min-h-[180px]">
                    <!-- รายการงานจะถูกแสดงที่นี่ -->
                </div>
            </div>

            <!-- คอลัมน์ 3: ทำเสร็จแล้ว (Done) -->
            <div class="bg-emerald-50/60 rounded-2xl p-4 border border-emerald-100 flex flex-col">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-emerald-200/70">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <h2 class="font-semibold text-emerald-900 text-base">3. ทำเสร็จแล้ว (Done)</h2>
                    </div>
                    <span id="count-done" class="bg-emerald-200/80 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full transition-all">0</span>
                </div>
                <div id="list-done" class="space-y-3.5 flex-1 min-h-[180px]">
                    <!-- รายการงานจะถูกแสดงที่นี่ -->
                </div>
            </div>

        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        ข้อมูลและเวลาสะสมถูกบันทึกอัตโนมัติในเบราว์เซอร์ของคุณ (Local Storage)
    </footer>

    <!-- JavaScript จัดการระบบทั้งหมด -->
    <script>
        // ใช้คีย์เดิมเพื่อให้รองรับข้อมูลเก่า และอัปเกรดโครงสร้างเวลาอัตโนมัติ
        const STORAGE_KEY = 'simple_todo_tracker_tasks_v1';
        let tasks = [];
        let lastAnimatedTaskId = null;
        let lastAnimationType = ''; // 'add' | 'move'
        let isAnimatingAction = false;

        // โหลดข้อมูลจาก localStorage
        function loadTasks() {
            const savedTasks = localStorage.getItem(STORAGE_KEY);
            if (savedTasks) {
                try {
                    const parsed = JSON.parse(savedTasks);
                    // อัปเกรดข้อมูลเก่าให้รองรับระบบจับเวลาแบบ Timestamp
                    tasks = parsed.map(task => ({
                        ...task,
                        createdAtMs: task.createdAtMs || (Number(task.id) || Date.now()),
                        completedAtMs: task.status === 'done' ? (task.completedAtMs || Date.now()) : null
                    }));
                } catch (e) {
                    tasks = [];
                }
            }
            renderTasks();
        }

        // บันทึกข้อมูลลง localStorage
        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        // แปลงเวลา Milliseconds เป็นรูปแบบ hh:mm:ss
        function formatClock(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            return [hours, minutes, seconds].map(v => String(v).padStart(2, '0')).join(':');
        }

        // แปลงเวลาที่ผ่านไปเป็นข้อความภาษาไทยเข้าใจง่าย (เช่น "5 นาทีที่แล้ว")
        function formatRelativeTime(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));
            if (totalSeconds < 60) return `${totalSeconds} วินาทีที่แล้ว`;
            const totalMinutes = Math.floor(totalSeconds / 60);
            if (totalMinutes < 60) return `${totalMinutes} นาทีที่แล้ว`;
            const hours = Math.floor(totalMinutes / 60);
            const mins = totalMinutes % 60;
            if (hours < 24) {
                return mins > 0 ? `${hours} ชั่วโมง ${mins} นาทีที่แล้ว` : `${hours} ชั่วโมงที่แล้ว`;
            }
            const days = Math.floor(hours / 24);
            const remainHours = hours % 24;
            return remainHours > 0 ? `${days} วัน ${remainHours} ชั่วโมงที่แล้ว` : `${days} วันที่แล้ว`;
        }

        // แปลงเวลาสรุปผลเมื่อทำงานเสร็จ (เช่น "1 ชั่วโมง 15 นาที")
        function formatFinalDuration(ms) {
            const totalSeconds = Math.max(1, Math.floor(ms / 1000));
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const parts = [];
            if (days > 0) parts.push(`${days} วัน`);
            if (hours > 0) parts.push(`${hours} ชั่วโมง`);
            if (minutes > 0) parts.push(`${minutes} นาที`);
            // แสดงวินาทีเมื่อใช้เวลาน้อยกว่า 1 ชั่วโมง เพื่อให้เห็นผลชัดเจนตอนทดสอบ
            if (seconds > 0 && hours === 0 && days === 0) {
                parts.push(`${seconds} วินาที`);
            }

            return parts.join(' ') || '1 วินาที';
        }

        // เพิ่มงานใหม่พร้อมอนิเมชั่น Pop Up
        function addTask(title) {
            const now = Date.now();
            const newTask = {
                id: now.toString(),
                title: title.trim(),
                status: 'todo',
                createdAtMs: now,
                completedAtMs: null,
                createdAtText: new Date(now).toLocaleDateString('th-TH', {
                    day: 'numeric',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit'
                })
            };
            tasks.unshift(newTask);
            lastAnimatedTaskId = newTask.id;
            lastAnimationType = 'add';
            saveTasks();
            renderTasks();
        }

        // เปลี่ยนสถานะงาน พร้อมอนิเมชั่นตอนย้ายออกและเข้าคอลัมน์ใหม่
        function changeStatus(id, newStatus) {
            if (isAnimatingAction) return;
            const taskIndex = tasks.findIndex(t => t.id === id);
            if (taskIndex === -1) return;

            const cardEl = document.getElementById(`task-card-${id}`);
            if (cardEl) {
                isAnimatingAction = true;
                cardEl.classList.remove('animate__zoomIn', 'animate__fadeInUp');
                cardEl.classList.add('animate__animated', 'animate__zoomOut');
                
                setTimeout(() => {
                    tasks[taskIndex].status = newStatus;
                    if (newStatus === 'done') {
                        tasks[taskIndex].completedAtMs = Date.now(); // หยุดเวลาและบันทึกเวลาที่ทำเสร็จ
                    } else {
                        tasks[taskIndex].completedAtMs = null; // หากย้ายกลับมาทำต่อ ให้เดินเวลาต่อ
                    }
                    lastAnimatedTaskId = id;
                    lastAnimationType = 'move';
                    isAnimatingAction = false;
                    saveTasks();
                    renderTasks();
                }, 260);
            } else {
                tasks[taskIndex].status = newStatus;
                tasks[taskIndex].completedAtMs = (newStatus === 'done') ? Date.now() : null;
                saveTasks();
                renderTasks();
            }
        }

        // ลบงาน พร้อมอนิเมชั่นจางหายออกไป
        function deleteTask(id) {
            if (isAnimatingAction) return;
            const cardEl = document.getElementById(`task-card-${id}`);
            if (cardEl) {
                isAnimatingAction = true;
                cardEl.classList.remove('animate__zoomIn', 'animate__fadeInUp');
                cardEl.classList.add('animate__animated', 'animate__fadeOutRight');
                
                setTimeout(() => {
                    tasks = tasks.filter(t => t.id !== id);
                    isAnimatingAction = false;
                    saveTasks();
                    renderTasks();
                }, 280);
            } else {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                renderTasks();
            }
        }

        // ป้องกัน XSS
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // แสดงสถานะเมื่อไม่มีงานในคอลัมน์
        function renderEmptyState(text) {
            return `
                <div class="h-36 flex flex-col items-center justify-center text-slate-400 border-2 border-dashed border-slate-200/80 rounded-xl p-4 text-center animate__animated animate__fadeIn">
                    <p class="text-sm">${text}</p>
                </div>
            `;
        }

        // สร้างการ์ดของแต่ละงาน
        function createTaskCard(task) {
            const safeTitle = escapeHTML(task.title);
            const now = Date.now();
            const createdMs = task.createdAtMs || now;
            const elapsedMs = (task.status === 'done' && task.completedAtMs)
                ? (task.completedAtMs - createdMs)
                : (now - createdMs);

            // กำหนดคลาสอนิเมชั่นเมื่อการ์ดถูกเพิ่มใหม่หรือย้ายคอลัมน์
            let entranceAnim = '';
            if (task.id === lastAnimatedTaskId) {
                entranceAnim = lastAnimationType === 'add' 
                    ? 'animate__animated animate__zoomIn' 
                    : 'animate__animated animate__fadeInUp';
            }

            // ส่วนแสดงผลเวลา (Time Elapsed Badge)
            let timerBadgeHTML = '';
            if (task.status === 'done') {
                const finalDurationText = formatFinalDuration(elapsedMs);
                timerBadgeHTML = `
                    <div class="bg-emerald-50 border border-emerald-200/80 text-emerald-800 rounded-lg px-3 py-2 text-xs flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-600 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                        </svg>
                        <span>ใช้เวลาทำไปทั้งหมด: <strong class="font-semibold text-emerald-950">${finalDurationText}</strong></span>
                    </div>
                `;
            } else {
                const isDoing = task.status === 'inprogress';
                const badgeColors = isDoing 
                    ? 'bg-sky-50 border-sky-200/80 text-sky-800' 
                    : 'bg-slate-100 border-slate-200/80 text-slate-600';
                const clockColors = isDoing
                    ? 'bg-sky-600 text-white'
                    : 'bg-slate-600 text-white';

                timerBadgeHTML = `
                    <div class="${badgeColors} border rounded-lg px-3 py-2 text-xs flex items-center justify-between gap-2">
                        <div class="flex items-center gap-1.5 min-w-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0 ${isDoing ? 'text-sky-500 animate-spin' : 'text-slate-400'}" style="${isDoing ? 'animation-duration: 6s;' : ''}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span class="truncate">สร้างเมื่อ <span class="js-live-relative font-medium" data-created="${createdMs}">${formatRelativeTime(elapsedMs)}</span></span>
                        </div>
                        <span class="js-live-clock ${clockColors} font-mono text-[11px] font-medium px-2 py-0.5 rounded-md shrink-0 tracking-wider" data-created="${createdMs}">
                            ${formatClock(elapsedMs)}
                        </span>
                    </div>
                `;
            }

            // ปุ่มควบคุมสถานะพร้อม Micro-interactions (Hover/Touch Scale Up)
            let actionButtons = '';
            if (task.status === 'todo') {
                actionButtons = `
                    <button onclick="changeStatus('${task.id}', 'inprogress')" 
                        class="flex-1 bg-sky-500 hover:bg-sky-600 active:scale-95 hover:scale-[1.02] text-white text-sm font-medium py-2.5 px-3 rounded-lg transition-all duration-150 flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
                        <span>เริ่มทำ</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                        </svg>
                    </button>
                `;
            } else if (task.status === 'inprogress') {
                actionButtons = `
                    <button onclick="changeStatus('${task.id}', 'todo')" 
                        class="bg-slate-100 hover:bg-slate-200 active:scale-95 hover:scale-105 text-slate-600 text-sm font-medium py-2.5 px-3 rounded-lg transition-all duration-150 flex items-center justify-center cursor-pointer" title="ย้อนกลับไป To Do">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 17l-5-5m0 0l5-5m-5 5h12" />
                        </svg>
                    </button>
                    <button onclick="changeStatus('${task.id}', 'done')" 
                        class="flex-1 bg-emerald-500 hover:bg-emerald-600 active:scale-95 hover:scale-[1.02] text-white text-sm font-medium py-2.5 px-3 rounded-lg transition-all duration-150 flex items-center justify-center gap-1.5 shadow-sm cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                        <span>ทำเสร็จแล้ว</span>
                    </button>
                `;
            } else if (task.status === 'done') {
                actionButtons = `
                    <button onclick="changeStatus('${task.id}', 'inprogress')" 
                        class="flex-1 bg-slate-100 hover:bg-slate-200 active:scale-95 hover:scale-[1.02] text-slate-600 text-sm font-medium py-2.5 px-3 rounded-lg transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                        </svg>
                        <span>ย้ายกลับไปทำต่อ</span>
                    </button>
                `;
            }

            const titleStyle = task.status === 'done' ? 'line-through text-slate-400' : 'text-slate-800';

            return `
                <div id="task-card-${task.id}" class="task-card-transition bg-white p-4 rounded-xl shadow-sm border border-slate-200/90 hover:shadow-md flex flex-col gap-3 ${entranceAnim}">
                    <div class="flex items-start justify-between gap-2">
                        <p class="font-medium text-base break-words flex-1 ${titleStyle}">${safeTitle}</p>
                    </div>
                    
                    ${timerBadgeHTML}

                    <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                        ${actionButtons}
                        <button onclick="deleteTask('${task.id}')" 
                            class="bg-rose-50 hover:bg-rose-100 active:scale-90 hover:scale-105 text-rose-600 p-2.5 rounded-lg transition-all duration-150 flex items-center justify-center shrink-0 cursor-pointer" 
                            title="ลบงานนี้" aria-label="ลบงาน">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                </div>
            `;
        }

        // แสดงผลรายการงานทั้งหมดบนหน้าจอ
        function renderTasks() {
            const todoList = document.getElementById('list-todo');
            const inProgressList = document.getElementById('list-inprogress');
            const doneList = document.getElementById('list-done');

            const todoTasks = tasks.filter(t => t.status === 'todo');
            const inProgressTasks = tasks.filter(t => t.status === 'inprogress');
            const doneTasks = tasks.filter(t => t.status === 'done');

            todoList.innerHTML = todoTasks.length 
                ? todoTasks.map(createTaskCard).join('') 
                : renderEmptyState('ยังไม่มีรายการสิ่งที่ต้องทำ');

            inProgressList.innerHTML = inProgressTasks.length 
                ? inProgressTasks.map(createTaskCard).join('') 
                : renderEmptyState('ยังไม่มีงานที่กำลังทำ');

            doneList.innerHTML = doneTasks.length 
                ? doneTasks.map(createTaskCard).join('') 
                : renderEmptyState('ยังไม่มีงานที่ทำเสร็จแล้ว');

            // ล้างค่าตัวแปรอนิเมชั่นหลังจากแสดงผลเสร็จ เพื่อไม่ให้เล่นซ้ำโดยไม่จำเป็น
            lastAnimatedTaskId = null;
            lastAnimationType = '';

            // อัปเดตตัวเลขจำนวนงาน
            document.getElementById('count-todo').textContent = todoTasks.length;
            document.getElementById('count-inprogress').textContent = inProgressTasks.length;
            document.getElementById('count-done').textContent = doneTasks.length;

            // อัปเดตสรุปความคืบหน้าด้านบน
            const total = tasks.length;
            const percent = total > 0 ? Math.round((doneTasks.length / total) * 100) : 0;
            document.getElementById('total-count').textContent = total;
            document.getElementById('done-percent').textContent = `${percent}%`;
        }

        // อัปเดตตัวนับเวลาแบบ Real-time ทุกๆ 1 วินาที โดยไม่ต้อง Re-render การ์ดใหม่ทั้งหมด
        function updateLiveTimers() {
            const now = Date.now();
            
            // อัปเดตนาฬิกาดิจิทัล (hh:mm:ss)
            document.querySelectorAll('.js-live-clock').forEach(clockEl => {
                const createdMs = Number(clockEl.getAttribute('data-created'));
                if (createdMs) {
                    clockEl.textContent = formatClock(now - createdMs);
                }
            });

            // อัปเดตข้อความเวลาสัมพัทธ์ ("...นาทีที่แล้ว")
            document.querySelectorAll('.js-live-relative').forEach(relEl => {
                const createdMs = Number(relEl.getAttribute('data-created'));
                if (createdMs) {
                    relEl.textContent = formatRelativeTime(now - createdMs);
                }
            });
        }

        // จัดการ Event เมื่อกดปุ่มเพิ่มงาน
        document.getElementById('task-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('task-input');
            if (input.value.trim() !== '') {
                addTask(input.value);
                input.value = '';
                input.focus();
            }
        });

        // เริ่มต้นระบบและตั้งเวลาอัปเดตทุกๆ 1 วินาที
        document.addEventListener('DOMContentLoaded', () => {
            loadTasks();
            setInterval(updateLiveTimers, 1000);
        });
    </script>
</body>
</html>
